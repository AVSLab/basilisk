name: Publish Wheels

on:
  push:
    tags:
      - "v[0-9]*"
      - "test*"
  workflow_dispatch:
    inputs:
      destination:
        description: "Publish destination"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
      recovery_run_id:
        description: "Recover artifacts from a failed tagged run; leave empty for a normal build"
        required: false
        type: string

jobs:
  resolve-rust-toolchain:
    uses: ./.github/workflows/resolve-rust-toolchain.yml

  build-wheels:
    if: ${{ inputs.recovery_run_id == '' }}
    name: Build Wheel Input (${{ matrix.wheel-kind }}, ${{ matrix.os }})
    needs: resolve-rust-toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26 # ARM64
          - ubuntu-24.04 # x86_64
          - ubuntu-24.04-arm # ARM64
          - windows-2025-vs2026 # x86_64
        wheel-kind:
          - core
          - opnav-full
        include:
          - wheel-kind: core
            output-dir: wheelhouse-core
            conan-args: --opNav False --mujoco True --rustModules True --clean
            save-conan-cache: "false"
          - wheel-kind: opnav-full
            output-dir: wheelhouse-opnav-full
            conan-args: --opNav True --mujoco True --rustModules True --clean
            save-conan-cache: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      # Workaround for macos-13 (Intel). Ensures the conan build uses the right
      # SSL cert.
      - name: Set CA bundle (macos-13 only)
        if: ${{ matrix.os == 'macos-13' }}
        shell: bash
        run: |
          python -m pip install -U certifi
          CA="$(python -c 'import certifi; print(certifi.where())')"
          {
          echo "REQUESTS_CA_BUNDLE=$CA"   # Python requests / Conan
          echo "PIP_CERT=$CA"             # pip
          echo "SSL_CERT_FILE=$CA"        # OpenSSL consumers
          echo "CURL_CA_BUNDLE=$CA"       # curl / CMake file(DOWNLOAD)
          echo "CMAKE_TLS_CAINFO=$CA"     # CMake
          } >> "$GITHUB_ENV"
          echo "Using CA: $CA"

      - name: Free runner disk for heavy optional Linux wheel
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.wheel-kind == 'opnav-full' }}
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          echo "Disk space after cleanup:"
          df -h

      - name: Build ${{ matrix.wheel-kind }} bsk wheel
        uses: ./.github/actions/build-wheel
        with:
          rust-toolchain: ${{ needs.resolve-rust-toolchain.outputs.version }}
          output-dir: ${{ matrix.output-dir }}
          conan-args: ${{ matrix.conan-args }}
          save-conan-cache: ${{ matrix.save-conan-cache }}

      - name: Upload wheel input
        uses: actions/upload-artifact@v6
        with:
          name: cibw-wheel-input-${{ matrix.os }}-${{ matrix.wheel-kind }}
          path: ${{ matrix.output-dir }}/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  package-wheels:
    name: Test and Package Wheels (${{ matrix.os }})
    needs: build-wheels
    if: ${{ !cancelled() && inputs.recovery_run_id == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26 # ARM64
          - ubuntu-24.04 # x86_64
          - ubuntu-24.04-arm # ARM64
          - windows-2025-vs2026 # x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Setup system dependencies
        uses: ./.github/actions/setup

      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Download core wheel input
        uses: actions/download-artifact@v6
        with:
          name: cibw-wheel-input-${{ matrix.os }}-core
          path: wheelhouse-core

      - name: Download opNav-enabled wheel input
        uses: actions/download-artifact@v6
        with:
          name: cibw-wheel-input-${{ matrix.os }}-opnav-full
          path: wheelhouse-opnav-full

      - name: Generate and test optional wheel installs
        shell: bash
        run: >
          python .github/scripts/run_optional_bsk_wheel_test.py
          --component opnav
          --base-wheel-dir wheelhouse-core
          --component-wheel-dir wheelhouse-opnav-full
          --optional-wheel-dir wheelhouse-optional
          --test-wheelhouse wheelhouse-test

      - name: Prepare publish wheels
        shell: bash
        run: |
          mkdir -p wheelhouse-publish
          cp wheelhouse-core/*.whl wheelhouse-publish/
          cp wheelhouse-optional/*.whl wheelhouse-publish/

      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse-publish/*.whl

  make_sdist:
    if: ${{ inputs.recovery_run_id == '' }}
    name: Make SDist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  test-sdist:
    name: Test SDist
    needs: make_sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup

      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Download sdist
        uses: actions/download-artifact@v6
        with:
          name: cibw-sdist
          path: dist

      - name: Verify SDist Installation
        run: |
          python .github/scripts/configure_conan_retries.py
          python -m pip install dist/*.tar.gz

  recover-release:
    name: Validate existing release artifacts
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.recovery_run_id != '' }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install artifact validation dependency
        run: python -m pip install packaging

      - name: Verify original run and unchanged release tag
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: python .github/scripts/recover_wheel_release.py run "$RECOVERY_RUN_ID"

      - name: Download original tested wheels
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ steps.source.outputs.wheel_artifact_ids }}
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist

      - name: Download original source archive
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ steps.source.outputs.sdist_artifact_id }}
          run-id: ${{ inputs.recovery_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: dist

      - name: Verify distribution versions and wheel inventory
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: python .github/scripts/recover_wheel_release.py files dist "$RELEASE_VERSION"

      - uses: ./.github/actions/setup

      - name: Install and import the original source distribution
        env:
          RELEASE_VERSION: ${{ steps.source.outputs.version }}
        run: |
          python .github/scripts/configure_conan_retries.py
          python -m pip install dist/*.tar.gz
          python -c 'import os, Basilisk; from importlib.metadata import version; expected = os.environ["RELEASE_VERSION"]; assert version("bsk") == expected; assert Basilisk.getBuildInfo()["artifact"]["basiliskVersion"] == expected'

      - name: Retain validated original distributions
        uses: actions/upload-artifact@v6
        with:
          name: recovered-release-dist
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish
    needs: [package-wheels, test-sdist, recover-release]
    if: >-
      ${{ !cancelled() &&
          (needs.recover-release.result == 'success' ||
           (needs.recover-release.result == 'skipped' &&
            needs.package-wheels.result == 'success' &&
            needs.test-sdist.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        if: ${{ needs.recover-release.result != 'success' }}
        uses: actions/download-artifact@v6
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        if: ${{ needs.recover-release.result != 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: cibw-sdist
          path: dist

      - name: Download validated recovery distributions
        if: ${{ needs.recover-release.result == 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: recovered-release-dist
          path: dist

      - name: Resolve publish config
        id: config
        env:
          RELEASE_REF: ${{ needs.recover-release.outputs.tag || github.ref_name }}
          RECOVERED: ${{ needs.recover-release.result == 'success' }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          ref="$RELEASE_REF"
          # Recovery validates the original tag before reusing its artifacts.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DESTINATION" == "pypi" ]]; then
            if [[ ( "$REF_TYPE" != "tag" && "$RECOVERED" != "true" ) || "$ref" == *rc* || "$ref" != v* ]]; then
              echo "::error::PyPI publish requires a non-RC version tag (e.g. vX.Y.Z). Got: $ref"
              exit 1
            fi
          fi
          # Route to TestPyPI for RC/test tags or manual testpypi dispatch
          if [[ "$ref" == *rc* || "$ref" == test* || "$DESTINATION" == "testpypi" ]]; then
            testpypi="true"
          else
            testpypi="false"
          fi
          if [[ "$testpypi" == "true" ]]; then
            echo "repo-url=https://test.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "skip-existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "repo-url=https://upload.pypi.org/legacy/" >> "$GITHUB_OUTPUT"
            echo "skip-existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ steps.config.outputs.repo-url }}
          packages-dir: dist
          skip-existing: ${{ steps.config.outputs.skip-existing }}
          verbose: true
