name: Publish Container

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish manifests from existing architecture images without rebuilding
        required: true
        default: false
        type: boolean
      release_tag:
        description: Existing release tag to publish, for example v2.11.1
        required: false
        type: string
      update_latest:
        description: Also update the latest manifest
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  IMAGE_GHCR: ghcr.io/${{ github.repository }}

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Push (${{ matrix.arch }})
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_existing }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
          flavor: |
            latest=false
            suffix=-${{ matrix.arch }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=container-${{ matrix.arch }},ignore-error=true

  publish:
    name: Publish Multi-Arch Manifests
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish_existing }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: build

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_GHCR }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create and push manifest lists
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            docker buildx imagetools create \
              -t "$tag" \
              "$tag-amd64" \
              "$tag-arm64"
            docker buildx imagetools inspect "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  publish-existing:
    name: Publish Existing Multi-Arch Manifests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_existing }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate architecture images and publish manifests
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid release tag::Expected a release tag such as v2.11.1."
            exit 1
          fi

          image="${IMAGE_GHCR,,}"
          amd64_image="${image}:${RELEASE_TAG}-amd64"
          arm64_image="${image}:${RELEASE_TAG}-arm64"

          docker buildx imagetools inspect "${amd64_image}"
          docker buildx imagetools inspect "${arm64_image}"
          docker buildx imagetools create \
            -t "${image}:${RELEASE_TAG}" \
            "${amd64_image}" \
            "${arm64_image}"
          docker buildx imagetools inspect "${image}:${RELEASE_TAG}"

          if [[ "${UPDATE_LATEST}" == "true" ]]; then
            docker buildx imagetools create \
              -t "${image}:latest" \
              "${amd64_image}" \
              "${arm64_image}"
            docker buildx imagetools inspect "${image}:latest"
          fi
