name: Test Optional Wheels

on:
  workflow_dispatch:
    inputs:
      windows_artifact_run_id:
        description: "Test existing Windows nightly wheel inputs instead of rebuilding"
        required: false
        type: string
        default: ""

jobs:
  resolve-rust-toolchain:
    if: ${{ inputs.windows_artifact_run_id == '' }}
    uses: ./.github/workflows/resolve-rust-toolchain.yml

  build-opnav-wheels:
    name: Build opNav Wheel Input (${{ matrix.wheel-kind }}, ${{ matrix.os }})
    needs: resolve-rust-toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
        wheel-kind:
          - core
          - opnav-full
        include:
          - wheel-kind: core
            output-dir: wheelhouse-core
            conan-args: --opNav False --mujoco True --rustModules True --clean
            save-conan-cache: "false"
          - wheel-kind: opnav-full
            output-dir: wheelhouse-opnav-full
            conan-args: --opNav True --mujoco True --rustModules True --clean
            save-conan-cache: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Remove runner-provided Microsoft apt sources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.sources

      - name: Free runner disk for heavy optional Linux wheel
        if: ${{ matrix.os == 'ubuntu-24.04' && matrix.wheel-kind == 'opnav-full' }}
        shell: bash
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          echo "Disk space after cleanup:"
          df -h

      - name: Build ${{ matrix.wheel-kind }} bsk wheel
        uses: ./.github/actions/build-wheel
        with:
          rust-toolchain: ${{ needs.resolve-rust-toolchain.outputs.version }}
          output-dir: ${{ matrix.output-dir }}
          conan-args: ${{ matrix.conan-args }}
          cibw-build: cp315-*
          save-conan-cache: ${{ matrix.save-conan-cache }}

      - name: Upload wheel input
        uses: actions/upload-artifact@v6
        with:
          name: optional-wheel-input-${{ matrix.os }}-${{ matrix.wheel-kind }}
          path: ${{ matrix.output-dir }}/*.whl
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  test-opnav-wheels:
    name: Test opNav Wheels (${{ matrix.os }})
    needs: build-opnav-wheels
    if: ${{ !cancelled() && inputs.windows_artifact_run_id == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Remove runner-provided Microsoft apt sources
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/azure-cli.sources
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.sources

      - name: Setup system dependencies
        uses: ./.github/actions/setup

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Download core wheel input
        uses: actions/download-artifact@v6
        with:
          name: optional-wheel-input-${{ matrix.os }}-core
          path: wheelhouse-core

      - name: Download opNav-enabled wheel input
        uses: actions/download-artifact@v6
        with:
          name: optional-wheel-input-${{ matrix.os }}-opnav-full
          path: wheelhouse-opnav-full

      - name: Generate and test optional wheel installs
        shell: bash
        run: >
          python .github/scripts/run_optional_bsk_wheel_test.py
          --component opnav
          --base-wheel-dir wheelhouse-core
          --component-wheel-dir wheelhouse-opnav-full
          --optional-wheel-dir wheelhouse-optional
          --test-wheelhouse wheelhouse-test

      - name: Upload wheel artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: optional-wheel-test-${{ matrix.os }}
          path: |
            wheelhouse-core/*.whl
            wheelhouse-opnav-full/*.whl
            wheelhouse-optional/*.whl

  test-existing-windows-wheels:
    name: Test Existing Windows Wheels
    if: ${{ inputs.windows_artifact_run_id != '' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 30 # [min]
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout validation scripts
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Download original core wheel
        uses: actions/download-artifact@v6
        with:
          name: nightly-wheel-input-windows-2025-vs2026-core
          path: wheelhouse-core
          run-id: ${{ inputs.windows_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Download original opNav wheel
        uses: actions/download-artifact@v6
        with:
          name: nightly-wheel-input-windows-2025-vs2026-opnav-full
          path: wheelhouse-opnav-full
          run-id: ${{ inputs.windows_artifact_run_id }}
          github-token: ${{ github.token }}

      - name: Record wheel checksums and validate runtime metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from build_optional_bsk_wheel import (
              MSVC_RUNTIME_DLL_PATTERN,
              read_msvc_runtime_version,
              validate_msvc_runtime_payloads,
          )

          wheels = []
          for directory in ("wheelhouse-core", "wheelhouse-opnav-full"):
              wheel, = Path(directory).glob("*.whl")
              wheels.append(wheel)
              print(hashlib.sha256(wheel.read_bytes()).hexdigest(), wheel)
              with zipfile.ZipFile(wheel) as archive:
                  for name in sorted(archive.namelist()):
                      if MSVC_RUNTIME_DLL_PATTERN.fullmatch(name):
                          print(name, read_msvc_runtime_version(archive.read(name)))
          with zipfile.ZipFile(wheels[0]) as base, zipfile.ZipFile(wheels[1]) as component:
              shared = sorted(set(base.namelist()) & set(component.namelist()))
              # Exercise the version reader on real DLLs even when bytes match.
              validate_msvc_runtime_payloads(
                  base, component,
                  [name for name in shared if MSVC_RUNTIME_DLL_PATTERN.fullmatch(name)],
              )
          PY

      - name: Install core wheel and test dependencies
        shell: bash
        run: python -m pip install pytest wheelhouse-core/*.whl

      - name: Test optional-wheel compatibility rules
        shell: bash
        run: python -m pytest src/tests/test_optionalWheelBuilder.py -q

      - name: Generate and test mixed optional wheel installs
        shell: bash
        run: >
          python .github/scripts/run_optional_bsk_wheel_test.py
          --component opnav
          --base-wheel-dir wheelhouse-core
          --component-wheel-dir wheelhouse-opnav-full
          --optional-wheel-dir wheelhouse-optional
          --test-wheelhouse wheelhouse-test

      - name: Exercise mixed native modules and messages
        shell: bash
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install wheelhouse-optional/*.whl
          python -c "from Basilisk import hasBuildFeature; assert hasBuildFeature('opNav')"
          python -m pytest -q \
            src/simulation/sensors/camera/_UnitTest/test_camera.py \
            src/fswAlgorithms/imageProcessing/limbFinding/_UnitTest/test_limbFinding.py \
            src/fswAlgorithms/imageProcessing/houghCircles/_UnitTest/test_houghCirlces.py

      - name: Retain tested wheel artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: verified-windows-wheel-pair
          retention-days: 7 # [days]
          path: |
            wheelhouse-core/*.whl
            wheelhouse-opnav-full/*.whl
            wheelhouse-optional/*.whl
