[package]
name = "bsk-input-port-tests"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false

# Compile the fixture as a normal library, so its generated lifecycle entry
# points are present. Integration tests then exercise the real macro expansion.
# This is not a discoverable Basilisk module and needs no C/C++ runtime.
[lib]
path = "fixture.rs"
test = false
doctest = false

[dependencies]
bsk-build = { path = "../../bsk_build", default-features = false }
