[package]
name = "bsk-utilities"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
description = "Rust bindings and safe wrappers for Basilisk C ABI utilities"

# `src/raw.rs` is generated and committed by
# `../gen_rust_utilities.py` from Basilisk's own headers.

[features]
# Compile the real Basilisk C utility sources into Rust test executables.
# Production modules instead resolve these symbols from ArchitectureUtilities.
ffi-tests = []

[dependencies]

[build-dependencies]
cc = "1.2"
